[package]
name = "cropdeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A fast native crop extraction workstation for tall sequential images"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.16"
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
natord = "1.0.9"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
webp = { version = "0.3.1", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
