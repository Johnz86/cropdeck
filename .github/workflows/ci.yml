name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Resolve release version
        id: version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cropdeck") | .version')"
          if [ -z "$crate_version" ]; then
            echo "Could not read the cropdeck package version" >&2
            exit 1
          fi
          release_tag="v$crate_version"
          tag_lookup=0
          git ls-remote --exit-code --tags origin "refs/tags/$release_tag" > /dev/null \
            || tag_lookup=$?
          case "$tag_lookup" in
            0) tag_exists=true ;;
            2) tag_exists=false ;;
            *) echo "Could not query tag $release_tag" >&2; exit "$tag_lookup" ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ] \
            && [ "$tag_exists" = false ]; then
            echo "version=$release_tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$release_tag-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            asset: windows-x86_64
          - name: Linux x86_64
            os: ubuntu-22.04
            asset: linux-x86_64
          - name: Linux aarch64
            os: ubuntu-22.04-arm
            asset: linux-aarch64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.quality.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test on the target platform
        run: cargo test -p cropdeck --all-features --locked
      - run: cargo build --release --locked

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/release/cropdeck.exe "dist/cropdeck-$VERSION-${{ matrix.asset }}.exe"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          arch="$(uname -m)"
          install -Dm755 target/release/cropdeck AppDir/usr/bin/cropdeck
          install -Dm644 assets/linux/cropdeck.desktop AppDir/usr/share/applications/cropdeck.desktop
          cp -r assets/linux/icons AppDir/usr/share/
          ln -s usr/bin/cropdeck AppDir/AppRun
          ln -s usr/share/applications/cropdeck.desktop AppDir/cropdeck.desktop
          ln -s usr/share/icons/hicolor/256x256/apps/cropdeck.png AppDir/cropdeck.png
          ln -s cropdeck.png AppDir/.DirIcon
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$arch.AppImage"
          chmod +x appimagetool
          mkdir dist
          ARCH="$arch" ./appimagetool --appimage-extract-and-run AppDir \
            "dist/cropdeck-$VERSION-${{ matrix.asset }}.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: cropdeck-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: needs.quality.outputs.release == 'true'
    needs: [quality, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.quality.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
